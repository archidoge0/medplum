name: GHAV Medplum 8890 full build before

on:
  push:
    branches:
      - codex/ghav-medplum8890-fullbuild-before

permissions:
  contents: read

jobs:
  build:
    name: Build (Node ${{ matrix.node-version }})
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        node-version: [22, 24]
    env:
      NODE_OPTIONS: --max-old-space-size=8192
      NODE_VERSION: ${{ matrix.node-version }}
      SECRETS_TURBO_TOKEN: ''
    steps:
      - name: Checkout pinned Before source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: 639da369d86e232359a9f37356a32df2046dbaa4
      - name: Verify source commit and tree
        run: |
          test "$(git rev-parse HEAD)" = '639da369d86e232359a9f37356a32df2046dbaa4'
          test "$(git rev-parse HEAD^{tree})" = '0fc5117435ef5970e0662937b8680009a5c5543b'
          echo "GHAV_SOURCE_SHA=$(git rev-parse HEAD)"
          echo "GHAV_SOURCE_TREE=$(git rev-parse HEAD^{tree})"
      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node-version }}
          registry-url: 'https://registry.npmjs.org'
      - name: Cache node modules
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        env:
          cache-name: cache-node-modules
        with:
          path: ~/.npm
          key: ghav8890-fullbuild-${{ runner.os }}-build-${{ env.cache-name }}-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ghav8890-fullbuild-${{ runner.os }}-build-${{ env.cache-name }}-
            ghav8890-fullbuild-${{ runner.os }}-build-
      - name: Setup TurboRepo
        if: ${{ env.SECRETS_TURBO_TOKEN != '' }}
        run: |
          echo "TURBO_TOKEN=${{ secrets.TURBO_TOKEN }}" >> $GITHUB_ENV
          echo "TURBO_TEAM=${{ secrets.TURBO_TEAM }}" >> $GITHUB_ENV
          echo "TURBO_CACHE=remote:rw" >> $GITHUB_ENV
      - name: Log npm stats
        run: |
          echo "GHAV_NODE_VERSION=$(node --version)"
          echo "GHAV_NPM_VERSION=$(npm --version)"
      - name: Install
        run: npm ci
      - name: Build Project
        run: npm run build
        env:
          MEDPLUM_BASE_URL: '__MEDPLUM_BASE_URL__'
          MEDPLUM_CLIENT_ID: '__MEDPLUM_CLIENT_ID__'
          MEDPLUM_REGISTER_ENABLED: '__MEDPLUM_REGISTER_ENABLED__'
          GOOGLE_CLIENT_ID: '__GOOGLE_CLIENT_ID__'
          RECAPTCHA_SITE_KEY: '__RECAPTCHA_SITE_KEY__'
      - name: Record complete build output witness
        run: |
          test -f packages/core/dist/cjs/index.cjs
          test -f packages/core/dist/esm/index.mjs
          test -f packages/server/dist/index.js
          test -f packages/app/dist/index.html
          echo "GHAV_CORE_CJS=$(sha256sum packages/core/dist/cjs/index.cjs | cut -d' ' -f1)"
          echo "GHAV_CORE_ESM=$(sha256sum packages/core/dist/esm/index.mjs | cut -d' ' -f1)"
          echo "GHAV_SERVER=$(sha256sum packages/server/dist/index.js | cut -d' ' -f1)"
          echo "GHAV_APP=$(sha256sum packages/app/dist/index.html | cut -d' ' -f1)"
