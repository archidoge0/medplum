name: "ghav human: Build"
"on":
  push:
    branches:
      - ghav/dev/4063
    paths:
      - .ghav/human
jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    strategy:
      matrix:
        node-version:
          - 18
          - 20
    env:
      NODE_VERSION: ${{ matrix.node-version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version == 18 && '18.19.1' || '20.11.1' }}
          registry-url: https://registry.npmjs.org
      - name: Cache node modules
        uses: actions/cache@v4
        env:
          cache-name: cache-node-modules
        with:
          path: ~/.npm
          key: ${{ runner.os }}-build-${{ env.cache-name }}-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-build-${{ env.cache-name }}-
            ${{ runner.os }}-build-
            ${{ runner.os }}-
      - name: Build Project
        run: ./scripts/ghav-human/build.sh
        env:
          MEDPLUM_BASE_URL: __MEDPLUM_BASE_URL__
          MEDPLUM_CLIENT_ID: __MEDPLUM_CLIENT_ID__
          MEDPLUM_REGISTER_ENABLED: __MEDPLUM_REGISTER_ENABLED__
          GOOGLE_CLIENT_ID: __GOOGLE_CLIENT_ID__
          RECAPTCHA_SITE_KEY: __RECAPTCHA_SITE_KEY__
  eslint:
    name: Run eslint
    runs-on: ubuntu-latest
    needs:
      - build
    env: {}
    outputs:
      eslint_errs: ${{ steps.fmt.outputs.eslint_errs }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version == 18 && '18.19.1' || '20.11.1' }}
          registry-url: https://registry.npmjs.org
      - name: Cache node modules
        uses: actions/cache@v4
        env:
          cache-name: cache-node-modules
        with:
          path: ~/.npm
          key: ${{ runner.os }}-build-${{ env.cache-name }}-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-build-${{ env.cache-name }}-
            ${{ runner.os }}-build-
            ${{ runner.os }}-
      - id: install
        name: Install eslint
        run: npm ci --maxsockets 1
      - id: build
        name: Build
        run: npm run build
      - name: Run eslint
        id: fmt
        run: "rm -f .failed\nNODE_OPTIONS='--max-old-space-size=8192' npm run lint 2> eslint.err > eslint1.err || echo 'failed' > .failed \n\nif [ -s .failed ]; then\n  delimiter=\"$(openssl rand -hex 8)\"\n  echo \"eslint_errs<<${delimiter}\" >> \"${GITHUB_OUTPUT}\"\n  cat eslint.err >> \"${GITHUB_OUTPUT}\"\n  cat eslint1.err >> \"${GITHUB_OUTPUT}\"\n  echo \"${delimiter}\" >> \"${GITHUB_OUTPUT}\"\nfi\n"
      - name: Fail the job
        if: steps.fmt.outputs.eslint_errs != ''
        run: |
          echo "❌ \"eslint\" reported errors"
          echo ""
          echo "${{ steps.fmt.outputs.eslint_errs }}"
          echo ""
          echo ""
          echo "To one-off fix this manually, run:"
          echo ""
          echo "npm run lint"
          echo ""
          echo ""
          echo "You might need to run \"npm install\" locally and configure your text editor to run ESLint in your editor."
          echo "See: https://marketplace.visualstudio.com/items?itemName=dbaeumer.vscode-eslint"
          echo ""
          echo "https://github.com/medplum/medplum/commits/${{github.sha}}"

          exit 1
  test:
    name: Run tests
    runs-on: ubuntu-latest
    needs:
      - build
    strategy:
      matrix:
        node-version:
          - 18
          - 20
        pg-version:
          - 12
          - 14
    env:
      NODE_VERSION: ${{ matrix.node-version }}
      PG_VERSION: ${{ matrix.pg-version }}
    services:
      postgres:
        image: postgres:${{ matrix.pg-version }}
        env:
          POSTGRES_DB: medplum_test
          POSTGRES_USER: medplum
          POSTGRES_PASSWORD: medplum
        options: --health-cmd pg_isready --health-interval 10s --health-timeout 5s --health-retries 5
        ports:
          - 5432/tcp
      redis:
        image: redis:6
        options: --health-cmd "redis-cli ping" --health-interval 10s --health-timeout 5s --health-retries 5
        ports:
          - 6379:6379
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version == 18 && '18.19.1' || '20.11.1' }}
          registry-url: https://registry.npmjs.org
      - name: Cache node modules
        uses: actions/cache@v4
        env:
          cache-name: cache-node-modules
        with:
          path: ~/.npm
          key: ${{ runner.os }}-build-${{ env.cache-name }}-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-build-${{ env.cache-name }}-
            ${{ runner.os }}-build-
            ${{ runner.os }}-
      - id: install
        name: Install deps
        run: npm ci --maxsockets 1
      - name: Test
        run: ./scripts/test.sh
        env:
          POSTGRES_HOST: localhost
          POSTGRES_PORT: ${{ job.services.postgres.ports[5432] }}
          REDIS_PASSWORD_DISABLED_IN_TESTS: 1
      - name: Upload code coverage
        if: ${{ matrix.node-version == 20 && matrix.pg-version == 14 }}
        uses: actions/upload-artifact@v4
        with:
          name: medplum-code-coverage
          path: coverage/lcov.info
  build-docs:
    name: Build the docs
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    env:
      NODE_VERSION: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version == 18 && '18.19.1' || '20.11.1' }}
          registry-url: https://registry.npmjs.org
      - name: Cache node modules
        uses: actions/cache@v4
        env:
          cache-name: cache-node-modules
        with:
          path: ~/.npm
          key: ${{ runner.os }}-build-${{ env.cache-name }}-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-build-${{ env.cache-name }}-
            ${{ runner.os }}-build-
            ${{ runner.os }}-
      - name: Build Project
        run: ./scripts/build-docs.sh
        env:
          MEDPLUM_BASE_URL: __MEDPLUM_BASE_URL__
          MEDPLUM_CLIENT_ID: __MEDPLUM_CLIENT_ID__
          MEDPLUM_REGISTER_ENABLED: __MEDPLUM_REGISTER_ENABLED__
          GOOGLE_CLIENT_ID: __GOOGLE_CLIENT_ID__
          RECAPTCHA_SITE_KEY: __RECAPTCHA_SITE_KEY__
